# Tooling config only. Storage Scanner is not installed as a package (it runs
# from a checkout or as a frozen PyInstaller binary), so there is deliberately
# no [project] table or build backend here.

[tool.ruff]
line-length = 100
# 3.9 is the oldest interpreter this code is run on locally; CI builds on 3.12.
# Keeping the floor here stops ruff from suggesting 3.10+-only syntax (match,
# `X | Y` annotations) that would break that local run.
target-version = "py39"
extend-exclude = ["build", "dist", "__pycache__"]

[tool.ruff.lint]
# E/W/F cover what pyflakes used to (F) plus pycodestyle. I = import order,
# UP = pyupgrade, B = bugbear, C4 = comprehensions, SIM/RET = simplifications.
# PTH (pathlib-over-os.path) is deliberately NOT enabled: the scanner's hot
# loops use os.scandir/os.path.join on purpose, and pathlib allocates a Path
# object per entry — exactly the overhead a disk scanner cannot pay.
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET"]

[tool.ruff.lint.per-file-ignores]
# Every test module inserts the repo root on sys.path before importing
# storage_scanner, so imports genuinely cannot all sit at the top.
"tests/*" = ["E402"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.mypy]
# No `python_version` pin: current mypy refuses anything below 3.10, and CI
# type-checks on 3.12. Ruff's `target-version = "py39"` is what keeps the
# source runnable on the older interpreter used locally.
# Deliberately not --strict: this is a largely unannotated Tkinter codebase,
# and the value is catching real type contradictions in the code that *is*
# annotated, not forcing annotations onto 45 modules at once.
ignore_missing_imports = true
exclude = ["build/", "dist/"]

[[tool.mypy.overrides]]
# The main window and its windows: their functions are untyped, so without
# this mypy skips their bodies, and with them every use of the attributes
# and methods the mixins share (declared in storage_scanner/ui/app_state.py).
module = ["storage_scanner.app", "storage_scanner.ui.*"]
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is measured everywhere; the floor is NOT enforced here. It lives
# on the one job that can actually meet it -- `pytest tests/
# --cov-fail-under=69` in build.yml's Windows `test` job.
#
# Why not here: tests/conftest.py skips every @pytest.mark.windows item off
# Windows, and the Windows-only modules those tests are the sole importers
# of (explorer_menu, scheduled_tasks, recycle_windows, redirection_guard)
# then stay in the denominator at 0%. A full macOS run measures 64.6%
# (742 passed, 103 skipped, 2026-11-04) against the same code that measures
# ~71% on Windows. With the floor in addopts, the plain `pytest tests/` the
# README tells contributors to run failed on macOS and Linux for a reason
# that has nothing to do with their change.
#
# The 69 is the Windows CI job's own total rounded down, less a couple of
# points so ordinary churn doesn't trip it. Set it from that job's TOTAL
# line, never from a local run: an unelevated local run also executes
# tests/test_redirection_guard.py (skipped in CI, whose runners are
# administrators) and a dev venv holding pyarrow/openpyxl runs the csv_to_*
# conversions (`importorskip`ped in the `test` job, which installs only
# requirements-dev.lock). Raise it as coverage grows; never lower it to get
# a build through.
addopts = "--cov=storage_scanner --cov-report=term-missing"

[tool.coverage.run]
branch = true
omit = ["*/__pycache__/*", "tests/*"]
