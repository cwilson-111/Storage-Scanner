# Runs the same ruff and black checks as CI's test job on every commit, so a
# lint or formatting break (like the NameError ruff reports that went into
# 32bbf60) is caught before it's pushed. Once per clone:
#
#     pip install pre-commit
#     pre-commit install
#
# Both tools read their settings from pyproject.toml. The versions are the
# ones requirements-dev.txt pins (CI installs them from requirements-dev.lock);
# move both together. Like
# the Actions in .github/workflows/build.yml, each hook repo is pinned to an
# immutable commit SHA, with the tag it corresponds to in the comment.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: a56c0b927e6465d37cae3e97d35d4d18ab2b96cd  # frozen: v0.16.9
    hooks:
      - id: ruff-check

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: a5439e9af2ff9371297bb1a76a01b8ad17989b88  # frozen: 26.10.1
    hooks:
      - id: black
