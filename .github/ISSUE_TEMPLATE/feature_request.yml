name: Idea or request
description: Something Storage Scanner could do, or do better.
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What you're trying to do
      description: The task or problem, rather than a particular solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
