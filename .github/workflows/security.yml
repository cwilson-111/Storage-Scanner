name: Security scanning

# Dependency, code and secret scanning. Separate from build.yml on purpose:
# these are repository-health checks, not release gates, so a CodeQL queue
# backlog can never hold up shipping a binary.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly, so a CVE published against a dependency that hasn't changed is
    # still found — a push-only trigger would never re-check a quiet repo.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      # Same SHA-pinning rule as build.yml: immutable commit, version in the
      # trailing comment for humans (and for Dependabot to bump).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: python
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # pip-audit rather than a third-party action: the whole dependency
      # surface is requirements-dev.txt (PyInstaller, Pillow, the test/lint
      # toolchain), and those land inside the shipped executable.
      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit build and test dependencies
        run: pip-audit --strict --requirement requirements-dev.txt

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks scans history, not just the tip, so it needs the full
          # clone rather than the default depth-1 one.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
