name: Build StorageScanner-Data.exe

# A separate build of the app WITH the optional Data Tools packages (pyarrow,
# openpyxl -- Compress CSV to Parquet / Convert CSV to Excel) bundled in.
# Kept apart from build.yml on purpose: pyarrow alone adds well over 100 MB
# to a --onefile exe, which the main release shouldn't pay for.
#
# Triggered only by tags shaped like data-v1.4.6 (deliberately NOT matching
# build.yml's "v*" trigger, so one tag never builds both), or manually from
# the Actions tab. Tag the commit on the `data` branch you want to ship.
#
# Published as a GitHub *pre-release*: that keeps it out of
# /releases/latest, so the README's main download link and the in-app update
# checker (both keyed to "latest") keep pointing at the normal build.
on:
  push:
    tags: ["data-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        # Listed explicitly (not just via requirements-dev.txt) so this
        # build can never silently ship without the packages it exists for.
        run: |
          pip install -r requirements-dev.txt
          pip install pyarrow openpyxl

      - name: Build Icon
        run: python make_icon.py

      - name: Stamp version
        # A "data-v..." stamp isn't a plain semver tag, so update_check
        # treats it as not-a-real-release and never nags this build to
        # "update" to the normal build's newer version number.
        run: python -c "open('storage_scanner/version.py', 'w').write('__version__ = ' + repr('${{ github.ref_name }}') + chr(10))"

      - name: Build executable
        # --hidden-import for each: they're imported lazily inside
        # try/except, which PyInstaller's static analysis usually -- but
        # not always -- follows.
        run: pyinstaller --onefile --windowed --name StorageScanner-Data --icon icon.ico --add-data "icon.ico;." --hidden-import pyarrow.csv --hidden-import pyarrow.parquet --hidden-import openpyxl Storage-Scanner.py

      - name: Smoke-test the built executable
        # Same headless --cli check as build.yml's Windows job (see the
        # comment there for why it goes through a Python script).
        run: python smoke_test_build.py dist/StorageScanner-Data.exe

      - name: Generate software bill of materials
        run: python make_sbom.py --app-version "${{ github.ref_name }}" --output dist/sbom-data.json

      - name: Create portable ZIP
        run: Compress-Archive -Path dist\StorageScanner-Data.exe -DestinationPath dist\StorageScanner-Data-portable.zip

      - name: Generate SHA-256 checksums
        run: |
          Get-FileHash dist\StorageScanner-Data.exe, dist\StorageScanner-Data-portable.zip, dist\sbom-data.json -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist\SHA256SUMS-data.txt
          Get-Content dist\SHA256SUMS-data.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: StorageScanner-Data
          path: |
            dist/StorageScanner-Data.exe
            dist/StorageScanner-Data-portable.zip
            dist/sbom-data.json
            dist/SHA256SUMS-data.txt

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: true
          files: |
            dist/StorageScanner-Data.exe
            dist/StorageScanner-Data-portable.zip
            dist/sbom-data.json
            dist/SHA256SUMS-data.txt
