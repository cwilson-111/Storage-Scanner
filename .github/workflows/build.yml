name: Build Storage Scanner

# Builds a Windows .exe (standard, and the Data build with Tools ▸ Data
# Tools), a macOS .dmg, and a Linux binary on every push to main and every
# pull request into main (downloadable from the Actions tab as artifacts),
# after the test jobs pass. Pushing a version tag like v1.0.0 also publishes
# all four in one GitHub Release, with that version's CHANGELOG.md section
# as the release notes (the release job at the end).
# Can also be triggered manually from the Actions tab (Run workflow).
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Read-only unless a job asks for more. The test and build jobs run code
# from pip and from pull requests, so their token can't push or publish
# (the build jobs may only sign and store provenance attestations); only
# the release job, which runs neither, gets write access.
permissions:
  contents: read

# A tag and main pushed at the same commit would build everything twice.
# Pushes share a group per commit, and a tag's run cancels a main run
# already going there (tag after main); a main run arriving while the tag's
# runs waits, then `tagged` below skips it (tag before main).
concurrency:
  group: ${{ github.event_name == 'push' && format('build-{0}', github.sha) || format('build-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/') }}

jobs:
  tagged:
    # Whether this is a push to main of a commit a version tag already
    # points at: that tag's run builds and releases it, so this one stops.
    # ls-remote lists an annotated tag's commit as "<sha> refs/tags/vX^{}".
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        run: |
          skip=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ] &&
             git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY" 'refs/tags/v*' | grep -q "^$GITHUB_SHA"; then
            skip=true
            echo "A version tag already points at $GITHUB_SHA; its run builds it."
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  test:
    # Windows, not ubuntu: several tests exercise Windows-only code paths
    # (NTFS MFT/Turbo Scan, drive-letter/volume-root resolution, cluster-size
    # allocation) that this repo has never run or verified on Linux, and the
    # build job below only ever targets windows-latest anyway.
    needs: tagged
    if: needs.tagged.outputs.skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      # Gates, in cheapest-first order so an obvious lint break fails in
      # seconds instead of after the whole suite. All four read their config
      # from pyproject.toml, so these commands match a local run exactly.
      # `.` rather than an explicit file list: PowerShell does not expand
      # `*.py` for a native command, and both tools recurse the repo while
      # honouring pyproject.toml's exclusions anyway.
      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy)
        run: mypy storage_scanner/ history.py

      - name: Run test suite with coverage
        run: pytest tests/

      # Scale regressions: bytes per scanned file, per history scan and per
      # Turbo cache record, and how many records a small-folder rescan loads,
      # against benchmarks/baseline.json. Timings are printed, never gated.
      - name: Scale benchmark gate
        run: python benchmarks/scale.py --check

  test-other-os:
    # The macOS and Linux builds ship too, and more than one Python runs the
    # app from source. Windows-only tests carry @pytest.mark.windows and are
    # skipped off Windows (tests/conftest.py); lint, types, coverage and the
    # scale gate run once, in the job above. Every build waits for both.
    # The Windows leg also installs the Data build's packages, so the
    # csv_to_* tests run their real conversions there (they skip without
    # pyarrow and openpyxl, as in the job above and the standard build).
    needs: tagged
    if: needs.tagged.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"
            data-packages: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Install the Data build's packages
        if: matrix.data-packages
        run: pip install -r requirements-data.txt

      # Tk needs a display: xvfb gives the Linux runner one.
      - name: Run test suite
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y xvfb > /dev/null
            xvfb-run -a pytest tests/ --no-cov
          else
            pytest tests/ --no-cov
          fi

  build:
    needs: [test, test-other-os]
    runs-on: windows-latest
    # Read-only like every job, plus what signing a provenance attestation
    # needs: an OIDC identity token and permission to store the attestation.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # Actions are pinned to an immutable commit SHA rather than a mutable
      # version tag (a tag like v4 can be moved to point at different code
      # later; a commit SHA can't) — supply-chain hardening for CI, at zero
      # cost. The trailing comment names the version that SHA corresponds to
      # today, for humans reading this file.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install -r requirements-dev.txt

      - name: Build Icon
        run: python make_icon.py

      - name: Stamp version
        # Bakes the git tag into storage_scanner/version.py so the frozen
        # exe knows its own version (needed by the update-notice feature).
        # A plain push to main (no tag) stamps "main" instead, which the
        # update checker's version parser deliberately treats as
        # not-a-real-release and never flags as outdated.
        run: python -c "open('storage_scanner/version.py', 'w').write('__version__ = ' + repr('${{ github.ref_name }}') + chr(10))"

      - name: Build executable
        run: pyinstaller --onefile --windowed --name StorageScanner --icon icon.ico --add-data "icon.ico;." Storage-Scanner.py

      - name: Smoke-test the built executable
        # Launches the real frozen .exe in headless --cli mode (what a
        # scheduled scan runs) and checks its exit code, JSON output and
        # history save, before anything is uploaded or released. Goes through
        # a Python script, not a direct call: PowerShell doesn't wait for a
        # windowed .exe, so calling it here would always "succeed".
        run: python smoke_test_build.py dist/StorageScanner.exe

      - name: Build the portable folder
        # The portable ZIP holds a one-folder build: the one-file exe unpacks
        # itself to %TEMP% on every launch (about 2 s), the folder starts in
        # about a quarter of a second.
        run: pyinstaller --onedir --windowed --name StorageScanner --icon icon.ico --add-data "icon.ico;." --distpath dist/portable --workpath build/portable Storage-Scanner.py

      - name: Smoke-test the portable folder
        run: python smoke_test_build.py dist/portable/StorageScanner/StorageScanner.exe

      - name: Generate software bill of materials
        run: python make_sbom.py --app-version "${{ github.ref_name }}" --output dist/sbom.json

      - name: Create portable ZIP
        run: Compress-Archive -Path dist\portable\StorageScanner -DestinationPath dist\StorageScanner-portable.zip

      - name: Generate SHA-256 checksums
        run: |
          Get-FileHash dist\StorageScanner.exe, dist\StorageScanner-portable.zip, dist\sbom.json -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Attest build provenance
        # A signed statement, kept by GitHub, that this workflow run built
        # these exact files from this commit: `gh attestation verify <file>
        # --repo cwilson-111/Storage-Scanner` checks a download against it.
        # Not on pull requests, whose token can't get an OIDC identity.
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/StorageScanner.exe
            dist/StorageScanner-portable.zip
            dist/sbom.json

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: StorageScanner
          path: |
            dist/StorageScanner.exe
            dist/StorageScanner-portable.zip
            dist/sbom.json
            dist/SHA256SUMS.txt

  build-data:
    # The Data build: the same app plus pyarrow and openpyxl, which turn on
    # Tools ▸ Data Tools (CSV to Parquet, CSV to Excel). Same tag, same
    # version stamp and same release as the standard build; only the
    # bundled packages and the file names differ.
    needs: [test, test-other-os]
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install -r requirements-dev.txt -r requirements-data.txt

      - name: Build Icon
        run: python make_icon.py

      - name: Stamp version
        run: python -c "open('storage_scanner/version.py', 'w').write('__version__ = ' + repr('${{ github.ref_name }}') + chr(10))"

      - name: Build executable
        # --hidden-import for each: the app finds them with find_spec and
        # imports them only when a Data Tools command runs, which
        # PyInstaller's static analysis can't follow.
        run: pyinstaller --onefile --windowed --name StorageScanner-Data --icon icon.ico --add-data "icon.ico;." --hidden-import pyarrow.csv --hidden-import pyarrow.parquet --hidden-import openpyxl Storage-Scanner.py

      - name: Smoke-test the built executable
        run: python smoke_test_build.py dist/StorageScanner-Data.exe

      - name: Build the portable folder
        # See the build job's step of the same name.
        run: pyinstaller --onedir --windowed --name StorageScanner-Data --icon icon.ico --add-data "icon.ico;." --hidden-import pyarrow.csv --hidden-import pyarrow.parquet --hidden-import openpyxl --distpath dist/portable --workpath build/portable Storage-Scanner.py

      - name: Smoke-test the portable folder
        run: python smoke_test_build.py dist/portable/StorageScanner-Data/StorageScanner-Data.exe

      - name: Generate software bill of materials
        run: python make_sbom.py --app-version "${{ github.ref_name }}" --output dist/sbom-data.json

      - name: Create portable ZIP
        run: Compress-Archive -Path dist\portable\StorageScanner-Data -DestinationPath dist\StorageScanner-Data-portable.zip

      - name: Generate SHA-256 checksums
        run: |
          Get-FileHash dist\StorageScanner-Data.exe, dist\StorageScanner-Data-portable.zip, dist\sbom-data.json -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist\SHA256SUMS-data.txt
          Get-Content dist\SHA256SUMS-data.txt

      - name: Attest build provenance
        # See the build job's step of the same name.
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/StorageScanner-Data.exe
            dist/StorageScanner-Data-portable.zip
            dist/sbom-data.json

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: StorageScanner-Data
          path: |
            dist/StorageScanner-Data.exe
            dist/StorageScanner-Data-portable.zip
            dist/sbom-data.json
            dist/SHA256SUMS-data.txt

  build-macos:
    needs: [test, test-other-os]
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install -r requirements-dev.txt

      - name: Build icons
        run: python make_icon.py

      - name: Stamp version
        # Same convention as the Windows build job: bakes the git tag into
        # storage_scanner/version.py so the frozen app knows its own version.
        run: python -c "open('storage_scanner/version.py', 'w').write('__version__ = ' + repr('${{ github.ref_name }}') + chr(10))"

      - name: Build .app bundle
        # --onedir, not --onefile: a macOS .app bundle IS a directory
        # structure (Contents/MacOS, Contents/Resources, ...) that Finder
        # treats as a single double-clickable icon -- PyInstaller's
        # --onefile mode targets a single flat binary, which is the right
        # shape for Windows but not what a native macOS app looks like.
        # icon.icns (not .ico) is macOS's own multi-resolution icon format.
        run: |
          pyinstaller --windowed --name StorageScanner --icon icon.icns \
            --add-data "icon.ico:." --add-data "icon.icns:." Storage-Scanner.py

      - name: Smoke-test the built app
        # Same check as the Windows job, against the executable inside the
        # .app bundle, before it's packed into the DMG.
        run: python smoke_test_build.py dist/StorageScanner.app/Contents/MacOS/StorageScanner

      - name: Create DMG
        # A DMG containing the .app plus an /Applications symlink is the
        # conventional macOS "drag to install" distribution format --
        # hdiutil is a stock macOS tool, no extra dependency needed.
        run: |
          mkdir -p dist/dmg
          cp -R dist/StorageScanner.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Storage Scanner" -srcfolder dist/dmg \
            -ov -format UDZO dist/StorageScanner.dmg

      - name: Generate software bill of materials
        run: python make_sbom.py --app-version "${{ github.ref_name }}" --output dist/sbom-macos.json

      - name: Generate SHA-256 checksums
        run: |
          shasum -a 256 dist/StorageScanner.dmg dist/sbom-macos.json > dist/SHA256SUMS-macos.txt
          cat dist/SHA256SUMS-macos.txt

      - name: Attest build provenance
        # See the build job's step of the same name.
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/StorageScanner.dmg
            dist/sbom-macos.json

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: StorageScanner-macOS
          path: |
            dist/StorageScanner.dmg
            dist/sbom-macos.json
            dist/SHA256SUMS-macos.txt

  build-linux:
    needs: [test, test-other-os]
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install -r requirements-dev.txt

      - name: Stamp version
        # Same convention as the Windows/macOS build jobs: bakes the git tag
        # into storage_scanner/version.py so the frozen app knows its own
        # version.
        run: python -c "open('storage_scanner/version.py', 'w').write('__version__ = ' + repr('${{ github.ref_name }}') + chr(10))"

      - name: Build executable
        # A plain --onefile ELF binary, matching the Windows job's own
        # shape -- Linux has no single standard installer/app-bundle format
        # the way Windows has .exe or macOS has .app/.dmg, so a single
        # portable "download, chmod +x, run" binary is the least surprising
        # choice, and needs no extra packaging tool (no fpm/appimagetool)
        # to stay inside this project's zero-extra-dependency policy.
        run: pyinstaller --onefile --name StorageScanner --add-data "icon.ico:." Storage-Scanner.py

      - name: Smoke-test the built executable
        # Same check as the Windows job. --cli never opens a window, so no
        # display server is needed on the runner.
        # xvfb gives --selftest-gui's hidden window a display.
        run: |
          sudo apt-get install -y xvfb > /dev/null
          xvfb-run -a python smoke_test_build.py dist/StorageScanner

      - name: Generate software bill of materials
        run: python make_sbom.py --app-version "${{ github.ref_name }}" --output dist/sbom-linux.json

      - name: Package
        run: |
          chmod +x dist/StorageScanner
          tar -czf dist/StorageScanner-linux-x86_64.tar.gz -C dist StorageScanner

      - name: Generate SHA-256 checksums
        run: |
          sha256sum dist/StorageScanner-linux-x86_64.tar.gz dist/sbom-linux.json > dist/SHA256SUMS-linux.txt
          cat dist/SHA256SUMS-linux.txt

      - name: Attest build provenance
        # See the build job's step of the same name.
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/StorageScanner-linux-x86_64.tar.gz
            dist/sbom-linux.json

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: StorageScanner-Linux
          path: |
            dist/StorageScanner-linux-x86_64.tar.gz
            dist/sbom-linux.json
            dist/SHA256SUMS-linux.txt

  release:
    # Publishes what the four build jobs uploaded, only for a tag, and only
    # once all four have passed, so a release never goes out missing a
    # platform. It builds nothing and installs nothing, which is why it's
    # the one job allowed to write.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, build-data, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: StorageScanner*
          path: dist
          merge-multiple: true

      - name: Release notes from CHANGELOG.md
        # Fails the release if CHANGELOG.md has no "## <tag>" section, so a
        # release page is never published empty again.
        env:
          TAG: ${{ github.ref_name }}
        run: python3 release_notes.py "$TAG" --output dist/release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body_path: dist/release-notes.md
          files: |
            dist/StorageScanner.exe
            dist/StorageScanner-portable.zip
            dist/sbom.json
            dist/SHA256SUMS.txt
            dist/StorageScanner-Data.exe
            dist/StorageScanner-Data-portable.zip
            dist/sbom-data.json
            dist/SHA256SUMS-data.txt
            dist/StorageScanner.dmg
            dist/sbom-macos.json
            dist/SHA256SUMS-macos.txt
            dist/StorageScanner-linux-x86_64.tar.gz
            dist/sbom-linux.json
            dist/SHA256SUMS-linux.txt
